set_output:
  target:
    entity:
      - integration: apple_tv_output
      - integration: apple_tv
        domain: media_player
    device:
      - integration: apple_tv_output
  fields:
    speakers:
      required: true
      example: '["Living Room", "media_player.kitchen", "34:7E:5C:D6:4E:1E"]'
      selector:
        text:
          multiple: true
    force:
      default: false
      selector:
        boolean:
    retries:
      default: 0
      selector:
        number:
          min: 0
          max: 5
          mode: box
    fail_if_not_applied:
      default: false
      selector:
        boolean:
