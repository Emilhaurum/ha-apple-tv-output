[project]
name = "ha-apple-tv-output"
version = "1.1.0"
description = "Home Assistant integration that sends an Apple TV's sound to AirPlay 2 speakers."
requires-python = ">=3.13"

[dependency-groups]
test = ["pytest-homeassistant-custom-component", "pyatv"]
lint = ["ruff", "mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "PLR0912", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
files = ["custom_components"]
ignore_missing_imports = true
check_untyped_defs = true
